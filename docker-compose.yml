version: '3.3'

services:
  app:
    build:
      context: .
    env_file: app/.env
    ports:
      - "9000:8000"
    volumes:
      - ./app:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5); raise SystemExit(0 if response.status == 200 and json.load(response) == {'status': 'ok'} else 1)"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
