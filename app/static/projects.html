<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<link rel="shortcut icon" href="/static/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q&Me — Projects</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;color:#1a1a2e;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
.hdr{background:#16213e;color:white;padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hdr-logo{display:flex;align-items:center}
.hdr-logo img{height:30px;display:block}
.gap{flex:1}
.btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .12s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-pri{background:#f36a17;color:white}.btn-pri:not(:disabled):hover{background:#d45a0f}
.btn-suc{background:#1e8449;color:white}.btn-suc:not(:disabled):hover{background:#166138}
.btn-gho{background:transparent;color:#9ab;border:1px solid #3d4757}.btn-gho:hover{background:#3d4757;color:#e0e6ef}

/* ── Main ── */
.main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:28px 24px}

/* ── Page title row ── */
.page-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.page-title{font-size:20px;font-weight:700;color:#1a1a2e;display:flex;align-items:center;gap:9px}
.page-title .cnt{font-size:13px;font-weight:400;color:#999;background:#e8eaed;padding:2px 9px;border-radius:10px}
.page-actions{display:flex;gap:8px;align-items:center}

/* ── Filter bar ── */
.filter-bar{display:flex;gap:8px;margin-bottom:18px;align-items:center}
.filter-inp{flex:1;max-width:340px;padding:7px 12px;border:1px solid #dde1e7;border-radius:6px;font-size:13px;outline:none;background:white;font-family:inherit;transition:border-color .12s}
.filter-inp:focus{border-color:#1a73e8;box-shadow:0 0 0 2px rgba(26,115,232,.1)}
.filter-label{font-size:12px;color:#999}

/* ── Project grid ── */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}

/* ── Project card ── */
.pcard{background:white;border:1px solid #e0e4ea;border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,border-color .15s;cursor:pointer;position:relative}
.pcard:hover{border-color:#a8c7fa;box-shadow:0 4px 16px rgba(26,115,232,.1)}
.pcard-top{display:flex;align-items:flex-start;gap:10px}
.pcard-id{font-size:11px;font-weight:700;background:#e8f0fe;color:#1a73e8;padding:3px 8px;border-radius:5px;flex-shrink:0;letter-spacing:.3px;font-family:monospace}
.pcard-code{font-size:11px;font-weight:700;background:#fce8e6;color:#c0392b;padding:3px 8px;border-radius:5px;flex-shrink:0;letter-spacing:.3px;font-family:monospace}
.pcard-title{font-size:13px;font-weight:600;color:#1a1a2e;line-height:1.4;flex:1}
.pcard-status{display:flex;gap:6px;flex-wrap:wrap}
.stag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.stag-ok{background:#e6f4ea;color:#1e8449;border:1px solid #b7dfbf}
.stag-no{background:#f5f5f5;color:#aaa;border:1px solid #e0e0e0}
.stag-designing{background:#fff8e1;color:#f57f17;border:1px solid #ffe082}
.stag-inprogress{background:#e3f2fd;color:#1565c0;border:1px solid #90caf9}
.stag-closed{background:#f3e5f5;color:#6a1b9a;border:1px solid #ce93d8}
.pcard-meta{font-size:10px;color:#999;display:flex;flex-direction:column;gap:2px}
.pcard-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard-open{margin-top:auto;padding-top:4px;display:flex;justify-content:flex-end}
.pcard-open .btn{padding:5px 14px;font-size:11px}

/* ── Empty state ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 24px;text-align:center;color:#aaa}
.empty-ico{font-size:48px;opacity:.5}
.empty h3{font-size:16px;font-weight:600;color:#555}
.empty p{font-size:12px;line-height:1.7;max-width:320px}

/* ── Loading ── */
.loading{display:flex;align-items:center;justify-content:center;padding:48px;gap:10px;color:#888;font-size:13px}
.spin{width:20px;height:20px;border:2.5px solid #e0e4ea;border-top-color:#1a73e8;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Modal overlay ── */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.mdlg{background:white;border-radius:12px;width:620px;max-width:100%;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mhd{padding:16px 20px;border-bottom:1px solid #e0e4ea;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mhd strong{font-size:15px;color:#1a1a2e;display:flex;align-items:center;gap:8px}
.mbtn-close{background:none;border:none;cursor:pointer;font-size:18px;color:#999;padding:2px 6px;border-radius:4px;line-height:1}
.mbtn-close:hover{background:#f0f2f5;color:#333}
.mbody{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.mft{padding:12px 20px;border-top:1px solid #e0e4ea;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;align-items:center}
.mft-status{flex:1;font-size:11px;color:#555;font-family:monospace;background:#f8f9fb;padding:5px 9px;border-radius:5px;max-height:52px;overflow-y:auto;white-space:pre-wrap}
.mft-status.err{color:#c0392b;background:#fce8e6}
.mft-status.ok{color:#1e8449;background:#e6f4ea}

/* Search dialog */
.search-row{display:flex;gap:8px}
.search-inp{flex:1;padding:8px 12px;border:1px solid #dde1e7;border-radius:6px;font-size:13px;outline:none;font-family:inherit}
.search-inp:focus{border-color:#1a73e8}
.res-list{border:1px solid #e0e4ea;border-radius:8px;max-height:320px;overflow-y:auto}
.res-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f2f5;transition:background .1s}
.res-item:last-child{border-bottom:none}
.res-item:hover{background:#eef4ff}
.res-item.sel{background:#e8f0fe;border-left:3px solid #1a73e8}
.res-item-title{font-size:13px;font-weight:600;color:#1a1a2e}
.res-item-sub{font-size:11px;color:#888;margin-top:2px}
.res-empty{padding:28px;text-align:center;color:#bbb;font-size:12px}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d0d4dc;border-radius:3px}

/* ── Fetch progress card ── */
#fetchProgress{position:fixed;bottom:24px;right:24px;z-index:8500;
  background:white;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.2);
  padding:16px 20px;min-width:340px;max-width:480px;
  border-left:4px solid #1a73e8;display:none;flex-direction:column;gap:10px;
  animation:fpSlideIn .25s ease}
@keyframes fpSlideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
#fpRow{display:flex;align-items:center;gap:10px}
#fpIcon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#fpText{flex:1}
#fpTitle{font-size:13px;font-weight:600;color:#1a1a2e}
#fpStep{font-size:11px;color:#888;margin-top:2px;font-family:monospace}
#fpElapsed{font-size:10px;color:#bbb;margin-top:1px}
#fpClose{background:none;border:none;cursor:pointer;color:#bbb;font-size:16px;line-height:1;padding:2px;display:none}
#fpClose:hover{color:#555}
#fpBar{height:3px;background:#e8eaed;border-radius:3px;overflow:hidden}
#fpBarFill{height:100%;width:5%;background:#1a73e8;border-radius:3px;transition:width .4s ease}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:22px;flex-wrap:wrap}
.pg-btn{min-width:32px;height:32px;padding:0 8px;border:1px solid #dde1e7;border-radius:6px;background:white;color:#444;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;justify-content:center}
.pg-btn:hover:not(:disabled){border-color:#f36a17;color:#f36a17;background:#fff4ee}
.pg-btn.active{background:#f36a17;color:white;border-color:#f36a17}
.pg-btn:disabled{opacity:.35;cursor:not-allowed}
.pg-info{font-size:11px;color:#999;padding:0 8px}
.pg-size{font-size:11px;padding:4px 8px;border:1px solid #dde1e7;border-radius:6px;background:white;color:#444;cursor:pointer;outline:none}
.pg-size:focus{border-color:#f36a17;outline:none}
</style>
</head>
<body>

<!-- QMe gate — shown when not connected, covers entire page -->
<div id="qmeGate" style="display:none;position:fixed;inset:0;background:#0d1117;z-index:9999;
     flex-direction:column;align-items:center;justify-content:center;gap:20px">
  <img src="/static/logo.png" alt="Q&Me" style="height:52px;filter:brightness(0) invert(1)">
  <div style="color:#8899aa;font-size:13px">Kết nối QMe MCP để tiếp tục</div>
  <button class="btn btn-pri" style="padding:10px 28px;font-size:13px;margin-top:8px"
          onclick="connectQme()">🔗 Connect QMe</button>
  <div id="qmeGateErr" style="color:#f87171;font-size:12px;display:none"></div>
</div>

<div class="hdr">
  <div class="hdr-logo"><img src="/static/logo.png" alt="Q&Me"></div>
  <div class="gap"></div>
  <button class="btn btn-pri" onclick="openNewDialog()">＋ New Survey</button>
  <button id="qmeBtn" class="btn btn-gho" onclick="connectQme()" style="font-size:11px;gap:5px">
    <span id="qmeDot" style="width:7px;height:7px;border-radius:50%;background:#666;display:inline-block"></span>
    <span id="qmeLbl">QMe</span>
  </button>
</div>

<!-- Global loading overlay -->
<div id="loadingOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
     z-index:8000;flex-direction:column;align-items:center;justify-content:center;gap:12px">
  <div class="spin" style="width:36px;height:36px;border-width:4px"></div>
  <div id="loadingMsg" style="color:#e0e6ef;font-size:13px;font-weight:600;text-align:center;max-width:340px"></div>
  <div id="loadingStep" style="color:#8899aa;font-size:11px;font-family:monospace;display:none;text-align:center;max-width:320px"></div>
  <div id="loadingElapsed" style="color:#667788;font-size:10px;display:none"></div>
  <div id="loadingBar" style="width:280px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;display:none">
    <div id="loadingBarFill" style="height:100%;width:5%;background:#a8c7fa;border-radius:3px;transition:width .4s ease"></div>
  </div>
</div>

<!-- Fetch progress card -->
<div id="fetchProgress">
  <div id="fpRow">
    <div id="fpIcon"><div class="spin" style="width:18px;height:18px;border-width:2.5px"></div></div>
    <div id="fpText">
      <div id="fpTitle">Fetching…</div>
      <div id="fpStep"></div>
      <div id="fpElapsed"></div>
    </div>
    <button id="fpClose" onclick="hideFetchProgress()">✕</button>
  </div>
  <div id="fpBar"><div id="fpBarFill"></div></div>
</div>

<!-- QMe login modal -->
<div id="qmeMov" class="mov" style="display:none;z-index:10000">
  <div class="mdlg" style="width:400px">
    <div class="mhd">
      <strong>🔗 Connect QMe</strong>
      <button class="mbtn-close" onclick="closeQmeModal()">✕</button>
    </div>

    <!-- Step 1: email + password -->
    <div id="qmeStep1">
      <div class="mbody" style="gap:10px">
        <input id="qmeEmail" type="email" placeholder="Email" autocomplete="email"
          style="width:100%;padding:8px 10px;border:1px solid #dde1e7;border-radius:6px;font-size:13px;outline:none;font-family:inherit">
        <input id="qmePassword" type="password" placeholder="Password" autocomplete="current-password"
          style="width:100%;padding:8px 10px;border:1px solid #dde1e7;border-radius:6px;font-size:13px;outline:none;font-family:inherit"
          onkeydown="if(event.key==='Enter')qmeDoLogin()">
      </div>
      <div class="mft">
        <div id="qmeLoginStatus" class="mft-status" style="display:none"></div>
        <button class="btn btn-gho" onclick="closeQmeModal()">Cancel</button>
        <button id="qmeLoginBtn" class="btn btn-pri" onclick="qmeDoLogin()">Send OTP</button>
      </div>
    </div>

    <!-- Step 2: OTP -->
    <div id="qmeStep2" style="display:none">
      <div class="mbody" style="gap:10px">
        <p style="font-size:12px;color:#555">OTP đã được gửi tới email của bạn.</p>
        <input id="qmeOtp" type="text" placeholder="Nhập OTP" maxlength="10"
          style="width:100%;padding:8px 10px;border:1px solid #dde1e7;border-radius:6px;font-size:18px;letter-spacing:6px;text-align:center;outline:none;font-family:monospace"
          onkeydown="if(event.key==='Enter')qmeDoVerify()">
      </div>
      <div class="mft">
        <div id="qmeOtpStatus" class="mft-status" style="display:none"></div>
        <button class="btn btn-gho" onclick="qmeBackToLogin()">← Back</button>
        <button id="qmeVerifyBtn" class="btn btn-pri" onclick="qmeDoVerify()">Verify</button>
      </div>
    </div>
  </div>
</div>

<div class="main">
  <div class="page-hd">
    <div class="page-title">
      Projects
      <span class="cnt" id="projCount">—</span>
    </div>
    <div class="page-actions">
      <button class="btn btn-gho" style="font-size:11px" onclick="loadProjects()">↻ Refresh</button>
    </div>
  </div>

  <div class="filter-bar">
    <input class="filter-inp" id="filterInp" type="text" placeholder="Filter projects…" oninput="renderCards(true)">
    <button class="btn btn-gho" id="sortBtn" style="font-size:11px;flex-shrink:0" onclick="toggleSort()">ID ↓</button>
    <span class="filter-label" id="filterLabel"></span>
  </div>

  <div id="projArea">
    <div class="loading"><div class="spin"></div> Loading projects…</div>
  </div>
  <div id="paginationBar"></div>
</div>

<!-- New Survey dialog -->
<div class="mov" id="newDlg" style="display:none" onclick="onOvClick(event)">
  <div class="mdlg" onclick="event.stopPropagation()">
    <div class="mhd">
      <strong>＋ New Survey</strong>
      <button class="mbtn-close" onclick="closeNewDialog()">✕</button>
    </div>
    <div class="mbody">
      <div class="search-row">
        <input class="search-inp" id="dlgSearch" placeholder="Search survey name in QMe…" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn btn-pri" onclick="doSearch()">🔍 Search</button>
      </div>
      <div class="res-list" id="dlgResults">
        <div class="res-empty">Enter keyword and press Search</div>
      </div>
    </div>
    <div class="mft">
      <div class="mft-status" id="dlgStatus" style="display:none"></div>
      <button class="btn btn-gho" onclick="closeNewDialog()">Cancel</button>
      <button class="btn btn-suc" id="dlgAddBtn" disabled onclick="doAddSurvey()">🔄 Fetch &amp; Open</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════
// LOADING LOCK
// ════════════════════════════════════════════════════
function showLoading(msg = 'Loading…', step = '', elapsed = null) {
  document.getElementById('loadingMsg').textContent = msg;
  const stepEl    = document.getElementById('loadingStep');
  const elapsedEl = document.getElementById('loadingElapsed');
  const barEl     = document.getElementById('loadingBar');
  stepEl.textContent    = step;
  stepEl.style.display  = step ? '' : 'none';
  elapsedEl.textContent = elapsed !== null ? `${elapsed}s elapsed` : '';
  elapsedEl.style.display = elapsed !== null ? '' : 'none';
  barEl.style.display   = '';
  document.getElementById('loadingOverlay').style.display = 'flex';
  // Animate bar only on first call (don't reset if already running)
  if (!_fpBarAnim) {
    let pct = 5;
    document.getElementById('loadingBarFill').style.width = pct + '%';
    _fpBarAnim = setInterval(() => {
      pct = Math.min(pct + (80 / 90), 85);
      document.getElementById('loadingBarFill').style.width = pct + '%';
    }, 1000);
  }
}
function hideLoading() {
  document.getElementById('loadingOverlay').style.display = 'none';
  clearInterval(_fpBarAnim); _fpBarAnim = null;
  const fill = document.getElementById('loadingBarFill');
  if (fill) { fill.style.width = '5%'; }
}

// ── Fetch progress card ──
let _fpBarAnim = null;

function showFetchProgress(title, step = '', elapsed = null, type = 'loading') {
  const card  = document.getElementById('fetchProgress');
  const icon  = document.getElementById('fpIcon');
  const fill  = document.getElementById('fpBarFill');
  const bar   = document.getElementById('fpBar');
  const close = document.getElementById('fpClose');
  document.getElementById('fpTitle').textContent   = title;
  document.getElementById('fpStep').textContent    = step;
  document.getElementById('fpElapsed').textContent = elapsed !== null ? `${elapsed}s elapsed` : '';

  if (type === 'loading') {
    card.style.borderLeftColor = '#1a73e8';
    icon.innerHTML = '<div class="spin" style="width:18px;height:18px;border-width:2.5px"></div>';
    bar.style.display = '';
    close.style.display = 'none';
    // Animate bar width 5% → 85% over ~90s to give a sense of progress
    if (!_fpBarAnim) {
      let pct = 5;
      fill.style.width = pct + '%';
      _fpBarAnim = setInterval(() => {
        pct = Math.min(pct + (80 / 90), 85);  // ~90s to reach 85%
        fill.style.width = pct + '%';
      }, 1000);  // bar ticks every 1s for smooth animation regardless of poll interval
    }
  } else if (type === 'success') {
    card.style.borderLeftColor = '#1e8449';
    icon.innerHTML = '<span style="color:#1e8449;font-size:18px;font-weight:700">✓</span>';
    bar.style.display = '';
    fill.style.width = '100%';
    fill.style.background = '#1e8449';
    close.style.display = '';
    clearInterval(_fpBarAnim); _fpBarAnim = null;
  } else if (type === 'error') {
    card.style.borderLeftColor = '#c0392b';
    icon.innerHTML = '<span style="color:#c0392b;font-size:18px;font-weight:700">✕</span>';
    bar.style.display = 'none';
    close.style.display = '';
    clearInterval(_fpBarAnim); _fpBarAnim = null;
  }

  card.style.display = 'flex';
}

function hideFetchProgress() {
  document.getElementById('fetchProgress').style.display = 'none';
  clearInterval(_fpBarAnim); _fpBarAnim = null;
  // reset bar for next use
  const fill = document.getElementById('fpBarFill');
  fill.style.width = '5%';
  fill.style.background = '#1a73e8';
}

// ════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════
let allProjects = [];
let dlgSelected = null;
let currentPage = 1;
let pageSize    = 9;
let sortDir     = 'desc'; // 'asc' | 'desc'

// ════════════════════════════════════════════════════
// PROJECTS LIST
// ════════════════════════════════════════════════════
function fmtProject(p) {
  // Format: [ID] CODE — Title   or   [ID] Title
  const parts = [`[${p.survey_id}]`];
  if (p.code) parts.push(p.code + ' —');
  parts.push(p.title || `Survey ${p.survey_id}`);
  return parts.join(' ');
}

async function loadProjects() {
  showLoading('Loading projects…');
  document.getElementById('projArea').innerHTML =
    '<div class="loading"><div class="spin"></div> Loading projects…</div>';
  try {
    allProjects = await fetch('/api/surveys/projects').then(r => r.json());
    renderCards();
  } catch(e) {
    document.getElementById('projArea').innerHTML =
      `<div class="empty"><div class="empty-ico">⚠️</div><h3>Failed to load</h3><p>${esc(e.message)}</p></div>`;
  } finally {
    hideLoading();
  }
}

function toggleSort() {
  sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  document.getElementById('sortBtn').textContent = sortDir === 'desc' ? 'ID ↓' : 'ID ↑';
  renderCards(true);
}

function renderCards(resetPage = false) {
  if (resetPage) currentPage = 1;

  const q = (document.getElementById('filterInp').value || '').toLowerCase();
  const filtered = q
    ? allProjects.filter(p => {
        const s = `${p.survey_id} ${p.code||''} ${p.title||''}`.toLowerCase();
        return s.includes(q);
      })
    : [...allProjects];

  filtered.sort((a, b) => sortDir === 'desc'
    ? b.survey_id - a.survey_id
    : a.survey_id - b.survey_id
  );

  document.getElementById('projCount').textContent = allProjects.length;
  document.getElementById('filterLabel').textContent =
    q && filtered.length !== allProjects.length ? `${filtered.length} of ${allProjects.length}` : '';

  if (!filtered.length) {
    document.getElementById('projArea').innerHTML = q
      ? `<div class="empty"><div class="empty-ico">🔍</div><h3>No matching projects</h3><p>No projects match "<strong>${esc(q)}</strong>"</p></div>`
      : `<div class="empty"><div class="empty-ico">📋</div><h3>No projects yet</h3><p>Click <strong>New Survey</strong> to fetch a survey from QMe and start working on it.</p></div>`;
    document.getElementById('paginationBar').innerHTML = '';
    return;
  }

  const totalPages = Math.ceil(filtered.length / pageSize);
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * pageSize;
  const paged = filtered.slice(start, start + pageSize);

  document.getElementById('projArea').innerHTML =
    `<div class="proj-grid">${paged.map(renderCard).join('')}</div>`;

  renderPagination(filtered.length, totalPages);
}

function renderPagination(total, totalPages) {
  const bar = document.getElementById('paginationBar');
  if (totalPages <= 1) { bar.innerHTML = ''; return; }

  const maxBtns = 7;
  let pages = [];
  if (totalPages <= maxBtns) {
    pages = Array.from({length: totalPages}, (_, i) => i + 1);
  } else {
    pages = [1];
    let lo = Math.max(2, currentPage - 2);
    let hi = Math.min(totalPages - 1, currentPage + 2);
    if (lo > 2)            pages.push('…');
    for (let i = lo; i <= hi; i++) pages.push(i);
    if (hi < totalPages - 1) pages.push('…');
    pages.push(totalPages);
  }

  const start = (currentPage - 1) * pageSize + 1;
  const end   = Math.min(currentPage * pageSize, total);

  bar.innerHTML = `
    <div class="pagination">
      <button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>
      ${pages.map(p => p === '…'
        ? `<span class="pg-info">…</span>`
        : `<button class="pg-btn${p===currentPage?' active':''}" onclick="goPage(${p})">${p}</button>`
      ).join('')}
      <button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>
      <span class="pg-info">${start}–${end} of ${total}</span>
      <select class="pg-size" onchange="changePageSize(this.value)">
        ${[9,18,36].map(n => `<option value="${n}"${n===pageSize?' selected':''}>${n} / page</option>`).join('')}
      </select>
    </div>`;
}

function goPage(p) {
  currentPage = p;
  renderCards();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function changePageSize(val) {
  pageSize = parseInt(val);
  currentPage = 1;
  renderCards();
}

function fmtDate(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return d.toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function surveyStatusBadge(status) {
  const map = {
    '1': ['Designing',   'stag-designing'],
    '2': ['In Progress', 'stag-inprogress'],
    '3': ['Closed',      'stag-closed'],
  };
  const [label, cls] = map[String(status)] || [null, null];
  return label ? `<span class="stag ${cls}">${label}</span>` : '';
}

function renderCard(p) {
  const idBadge    = `<span class="pcard-id">${p.survey_id}</span>`;
  const codeBadge  = p.code ? `<span class="pcard-code">${esc(p.code)}</span>` : '';
  const title      = esc(p.title || `Survey ${p.survey_id}`);
  const tagData    = p.has_data
    ? `<span class="stag stag-ok">✓ Data</span>`
    : `<span class="stag stag-no">— Data</span>`;
  const tagDT      = p.has_datatable
    ? `<span class="stag stag-ok">✓ Datatable</span>`
    : `<span class="stag stag-no">— Datatable</span>`;
  const tagStatus  = surveyStatusBadge(p.status);
  const url        = openUrl(p);

  const metaLines = [];
  if (p.created_by)   metaLines.push(`<span>Created by ${esc(p.created_by)}${p.created_at  ? ' · ' + fmtDate(p.created_at)  : ''}</span>`);
  if (p.refreshed_by) metaLines.push(`<span>Refreshed by ${esc(p.refreshed_by)}${p.refreshed_at ? ' · ' + fmtDate(p.refreshed_at) : ''}</span>`);
  const metaHtml = metaLines.length ? `<div class="pcard-meta">${metaLines.join('')}</div>` : '';

  return `<div class="pcard" onclick="window.location='${url}'">
    <div class="pcard-top">
      ${idBadge}${codeBadge}${tagStatus ? ' '+tagStatus : ''}
      <div class="pcard-title">${title}</div>
    </div>
    <div class="pcard-status">${tagData}${tagDT}</div>
    ${metaHtml}
    <div class="pcard-open">
      <button class="btn btn-pri" onclick="event.stopPropagation();window.location='${url}'">Open →</button>
    </div>
  </div>`;
}

function openUrl(p) {
  const params = new URLSearchParams({
    survey_id: p.survey_id,
    title: fmtProject(p),
  });
  return `/editor?${params}`;
}

// ════════════════════════════════════════════════════
// NEW SURVEY DIALOG
// ════════════════════════════════════════════════════
function openNewDialog() {
  dlgSelected = null;
  document.getElementById('dlgSearch').value = '';
  document.getElementById('dlgResults').innerHTML = '<div class="res-empty">Enter keyword and press Search</div>';
  document.getElementById('dlgAddBtn').disabled = true;
  setDlgStatus('', '');
  document.getElementById('newDlg').style.display = 'flex';
  setTimeout(() => document.getElementById('dlgSearch').focus(), 50);
}
function closeNewDialog() {
  document.getElementById('newDlg').style.display = 'none';
}
function onOvClick(e) {
  if (e.target === document.getElementById('newDlg')) closeNewDialog();
}

async function doSearch() {
  const q = document.getElementById('dlgSearch').value.trim();
  const res = document.getElementById('dlgResults');
  res.innerHTML = '<div class="res-empty"><span class="spin" style="display:inline-block;width:14px;height:14px;border-width:2px;vertical-align:-3px;margin-right:6px"></span>Searching…</div>';
  dlgSelected = null;
  document.getElementById('dlgAddBtn').disabled = true;
  try {
    const data = await apiFetch(`/api/surveys/search?q=${encodeURIComponent(q)}&limit=50`).then(r => r.json());
    const surveys = data.surveys || data.results || (Array.isArray(data) ? data : []);
    if (!surveys.length) { res.innerHTML = '<div class="res-empty">No surveys found</div>'; return; }
    res.innerHTML = surveys.map(s => {
      const id    = s.survey_id || s.id;
      const title = s.display_title || s.title || s.name || `Survey ${id}`;
      const code  = s.code || s.survey_code || '';
      const statusMap = {'1':'Designing','2':'In Progress','3':'Closed'};
      const statusLabel = statusMap[String(s.status)] || (s.status ? `Status ${s.status}` : '');
      const sub   = [code, statusLabel, s.question_count ? `${s.question_count} questions` : ''].filter(Boolean).join(' · ');
      return `<div class="res-item" data-id="${id}" data-title="${esc(title)}" data-code="${esc(code)}" onclick="selectResult(this)">
        <div class="res-item-title">[${id}]${code?' '+code+' —':''} ${esc(title)}</div>
        ${sub ? `<div class="res-item-sub">${esc(sub)}</div>` : ''}
      </div>`;
    }).join('');
  } catch(e) {
    res.innerHTML = `<div class="res-empty">Error: ${esc(e.message)}</div>`;
  }
}

function selectResult(el) {
  document.querySelectorAll('.res-item').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  dlgSelected = {
    id: parseInt(el.dataset.id),
    title: el.dataset.title,
    code: el.dataset.code || null,
  };
  document.getElementById('dlgAddBtn').disabled = false;
  setDlgStatus('', '');
}

async function doAddSurvey() {
  if (!dlgSelected) return;
  const btn = document.getElementById('dlgAddBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Opening…';
  closeNewDialog();

  try {
    // Start background fetch job — returns immediately
    const r = await apiFetch(`/api/surveys/${dlgSelected.id}/refresh`, {method:'POST'});
    let d = {};
    try { d = await r.json(); } catch {}
    if (!r.ok) throw new Error(d.detail || `Server error (HTTP ${r.status})`);

    // Navigate to editor immediately — editor will auto-detect the running job
    // and resume polling via _pollRefreshJob
    const displayTitle = encodeURIComponent(`[${dlgSelected.id}] ${dlgSelected.title}`);
    window.location = `/editor?survey_id=${dlgSelected.id}&title=${displayTitle}`;

  } catch(e) {
    if (/reconnect|token expired|unauthori[sz]ed|401/i.test(e.message)) {
      _showAuthExpired();
    } else {
      showFetchProgress(`✕ Fetch failed`, e.message, null, 'error');
    }
    btn.disabled = false;
    btn.textContent = '🔄 Fetch & Open';
  }
}

function setDlgStatus(msg, cls) {
  const el = document.getElementById('dlgStatus');
  el.style.display = msg ? 'block' : 'none';
  el.textContent = msg;
  el.className = 'mft-status' + (cls ? ' ' + cls : '');
}

// ════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/** Fetch wrapper — shows login gate and throws on HTTP 401. */
async function apiFetch(url, opts = {}) {
  const r = await fetch(url, opts);
  if (r.status === 401) {
    _showAuthExpired();
    const data = await r.json().catch(() => ({}));
    throw new Error(data.detail || 'QMe authentication required — please reconnect');
  }
  return r;
}

/** Mark QMe as disconnected and open the login modal. */
function _showAuthExpired() {
  document.getElementById('qmeGate').style.display = 'flex';
  document.getElementById('qmeDot').style.background = '#f87171';
  document.getElementById('qmeLbl').textContent = 'Connect QMe';
  document.getElementById('qmeBtn').onclick = connectQme;
  setTimeout(() => connectQme(), 300);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeNewDialog();
});

// ════════════════════════════════════════════════════
// QMe CONNECTION
// ════════════════════════════════════════════════════
async function checkQmeStatus() {
  try {
    const { connected, email } = await fetch('/api/qme/status').then(r => r.json());
    const dot = document.getElementById('qmeDot');
    const lbl = document.getElementById('qmeLbl');
    const btn = document.getElementById('qmeBtn');
    const gate = document.getElementById('qmeGate');
    if (connected) {
      gate.style.display = 'none';
      dot.style.background = '#22c55e';
      lbl.textContent = email || 'QMe Connected';
      btn.title = `Connected as ${email || 'QMe'} — click to disconnect`;
      btn.onclick = disconnectQme;
    } else {
      gate.style.display = 'flex';
      dot.style.background = '#f87171';
      lbl.textContent = 'Connect QMe';
      btn.title = 'Click to connect QMe';
      btn.onclick = connectQme;
    }
  } catch(_) {}
}

let _qmeRef = '';

function connectQme() {
  document.getElementById('qmeMov').style.display = 'flex';
  document.getElementById('qmeStep1').style.display = '';
  document.getElementById('qmeStep2').style.display = 'none';
  document.getElementById('qmeLoginStatus').style.display = 'none';
  setTimeout(() => document.getElementById('qmeEmail').focus(), 50);
}

function closeQmeModal() {
  document.getElementById('qmeMov').style.display = 'none';
}

function qmeBackToLogin() {
  document.getElementById('qmeStep2').style.display = 'none';
  document.getElementById('qmeStep1').style.display = '';
}

async function qmeDoLogin() {
  const email = document.getElementById('qmeEmail').value.trim();
  const password = document.getElementById('qmePassword').value;
  if (!email || !password) return;

  const btn = document.getElementById('qmeLoginBtn');
  const status = document.getElementById('qmeLoginStatus');
  btn.disabled = true; btn.textContent = 'Sending…';
  status.style.display = 'none';

  try {
    const r = await fetch('/api/qme/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || JSON.stringify(data));
    _qmeRef = data.ref || '';
    document.getElementById('qmeStep1').style.display = 'none';
    document.getElementById('qmeStep2').style.display = '';
    document.getElementById('qmeOtpStatus').style.display = 'none';
    document.getElementById('qmeOtp').value = '';
    document.getElementById('qmeOtp').focus();
  } catch(e) {
    status.style.display = '';
    status.className = 'mft-status err';
    status.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Send OTP';
  }
}

async function qmeDoVerify() {
  const email = document.getElementById('qmeEmail').value.trim();
  const otp = document.getElementById('qmeOtp').value.trim();
  if (!otp) return;

  const btn = document.getElementById('qmeVerifyBtn');
  const status = document.getElementById('qmeOtpStatus');
  btn.disabled = true; btn.textContent = 'Verifying…';
  status.style.display = 'none';

  try {
    const r = await fetch('/api/qme/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, ref: _qmeRef, otp }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || JSON.stringify(data));
    closeQmeModal();
    await checkQmeStatus();
    loadProjects();
  } catch(e) {
    status.style.display = '';
    status.className = 'mft-status err';
    status.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Verify';
  }
}

async function disconnectQme() {
  if (!confirm('Disconnect QMe?')) return;
  await fetch('/api/qme/disconnect', { method: 'DELETE' });
  checkQmeStatus();
}

// ── Init ──
loadProjects();
checkQmeStatus();
fetch('/api/version').then(r => r.json()).then(d => {
  document.getElementById('appVersion').textContent = `apdp v${d.apdp} · sf v${d.surveyflow}`;
}).catch(() => {});
