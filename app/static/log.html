<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="shortcut icon" href="/static/favicon.png">
<title>Usage Log</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #222; font-size: 13px; }
  .hdr { background: #16213e; color: white; padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .hdr-logo { display: flex; align-items: center; }
  .hdr-logo img { height: 30px; display: block; }
  .hdr-sep { width: 1px; height: 22px; background: #2d3748; flex-shrink: 0; }
  .hdr-title { font-size: 13px; font-weight: 700; color: #e0e6ef; white-space: nowrap; }
  .hdr-sub { font-size: 11px; color: #6b7a99; white-space: nowrap; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e0e0e0; }
  .topbar button { padding: 5px 14px; border-radius: 5px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 12px; }
  .topbar button:hover { background: #f5f5f5; }
  .topbar .ts { margin-left: auto; color: #888; font-size: 11px; }
  .page { padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }
  .card { background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; overflow: hidden; }
  .card-hdr { padding: 12px 16px; border-bottom: 1px solid #e8e8e8; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .card-hdr .badge { background: #e8f0fe; color: #1a73e8; border-radius: 20px; padding: 1px 8px; font-size: 11px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #fafafa; font-weight: 600; text-align: left; padding: 8px 12px; border-bottom: 1px solid #e8e8e8; font-size: 11px; color: #555; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
  td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafcff; }
  .email { font-weight: 600; color: #1a1a2e; }
  .never { color: #bbb; font-style: italic; }
  .ts-cell { font-size: 11px; color: #666; white-space: nowrap; }
  .action-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .pill-login     { background: #e6f4ea; color: #2e7d32; }
  .pill-logout    { background: #fce8e6; color: #c62828; }
  .pill-page_load { background: #e8f0fe; color: #1565c0; }
  .pill-preview   { background: #fef3e2; color: #e65100; }
  .pill-save      { background: #f3e5f5; color: #6a1b9a; }
  .pill-download  { background: #e0f7fa; color: #006064; }
  .pill-open_datatable { background: #fff3e0; color: #bf360c; }
  .pill-other     { background: #f5f5f5; color: #555; }
  .total-badge { font-weight: 800; font-size: 13px; }
  .log-table td { font-size: 12px; }
  .act-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .no-data { text-align: center; color: #aaa; padding: 32px 0; font-size: 13px; }
  .surveys-list { font-size: 11px; color: #666; max-width: 220px; }
  .err { background: #fce8e6; color: #c62828; padding: 16px; border-radius: 8px; font-size: 13px; }
  .filter-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid #f0f0f0; background: #fafafa; }
  .filter-bar input { padding: 4px 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 12px; width: 220px; }
  .filter-bar label { font-size: 11px; color: #666; }
  .filter-bar select { padding: 4px 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-logo"><img src="/static/logo.png" alt="Q&Me"></div>
  <div class="hdr-sep"></div>
  <span class="hdr-title">Usage Log</span>
  <span class="hdr-sub">FW users activity dashboard</span>
</div>
<div class="topbar">
  <button onclick="load()">🔄 Refresh</button>
  <span class="ts" id="loadTs"></span>
</div>

<div class="page" id="page">
  <div class="no-data">Loading…</div>
</div>

<script>
const ACTION_LABEL = {
  login:         '🔑 Login',
  logout:        '🚪 Logout',
  page_load:     '🔃 Page load',
  preview:       '👁 Preview',
  save:          '💾 Save',
  download:      '📥 Download',
  open_datatable:'📂 Open file',
};
const ACTION_CLS = {
  login:'pill-login', logout:'pill-logout', page_load:'pill-page_load',
  preview:'pill-preview', save:'pill-save', download:'pill-download',
  open_datatable:'pill-open_datatable',
};

function pillCls(a) { return ACTION_CLS[a] || 'pill-other'; }
function pillLbl(a) { return ACTION_LABEL[a] || a; }

function fmtTs(ts) {
  if (!ts) return '<span class="never">—</span>';
  const d = new Date(ts);
  // Show in local time
  return d.toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour12: false });
}

async function load() {
  document.getElementById('page').innerHTML = '<div class="no-data">Loading…</div>';
  try {
    const [sum, rec] = await Promise.all([
      fetch('/api/log/summary').then(r => { if (!r.ok) throw new Error(r.status+' '+r.statusText); return r.json(); }),
      fetch('/api/log/recent').then(r => { if (!r.ok) throw new Error(r.status+' '+r.statusText); return r.json(); }),
    ]);
    document.getElementById('loadTs').textContent = 'Updated: ' + new Date().toLocaleTimeString('vi-VN', {hour12:false});
    renderPage(sum, rec);
  } catch(e) {
    document.getElementById('page').innerHTML = `<div class="err">⚠ ${e.message}<br>Make sure you are logged in at <a href="/">the app</a>.</div>`;
  }
}

function renderPage(sum, rec) {
  const page = document.getElementById('page');

  // ── Summary card
  const EXCLUDE_ACTIONS = new Set(['upload_zip']);
  const allActions = new Set();
  sum.users.forEach(u => Object.keys(u.actions).forEach(a => allActions.add(a)));
  const actionCols = [...allActions].filter(a => !EXCLUDE_ACTIONS.has(a)).sort();

  let tHead = `<tr><th>User</th><th>Last seen (ICT)</th><th>Total</th>`;
  actionCols.forEach(a => { tHead += `<th>${pillLbl(a)}</th>`; });
  tHead += `</tr>`;

  let tBody = '';
  sum.users.forEach(u => {
    const last = fmtTs(u.last_seen);
    const total = u.total || 0;
    tBody += `<tr>
      <td class="email">${u.email}</td>
      <td class="ts-cell">${last}</td>
      <td class="total-badge">${total || '<span class="never">0</span>'}</td>`;
    actionCols.forEach(a => {
      const cnt = u.actions[a] || 0;
      tBody += `<td>${cnt ? `<span class="pill ${pillCls(a)}">${cnt}</span>` : '<span style="color:#ccc">—</span>'}</td>`;
    });
    tBody += '</tr>';
  });

  // ── Recent events (filtered by action)
  let recHtml = buildRecentTable(rec, 'all');

  page.innerHTML = `
    <div class="card">
      <div class="card-hdr">
        👥 FW Users Summary
        <span class="badge">${sum.users.length} users · ${sum.total_events} events</span>
      </div>
      <div style="overflow:auto;max-height:62vh">
        <table><thead>${tHead}</thead><tbody>${tBody || '<tr><td colspan="99" class="no-data">No data</td></tr>'}</tbody></table>
      </div>
    </div>

    <div class="card">
      <div class="card-hdr">
        🕐 Recent Activity
        <span class="badge">${rec.length} records</span>
      </div>
      <div class="filter-bar">
        <label>Filter:</label>
        <select id="actFilter" onchange="filterRecent()">
          <option value="all">All actions</option>
          ${[...allActions].sort().map(a => `<option value="${a}">${pillLbl(a)}</option>`).join('')}
        </select>
        <input type="text" id="emailFilter" placeholder="Filter by email…" oninput="filterRecent()">
      </div>
      <div id="recentWrap" style="overflow-x:auto">${recHtml}</div>
    </div>`;

  // Store recent for filtering
  window._recData = rec;
  window._allActions = allActions;
}

function buildRecentTable(records, actFilter, emailFilter) {
  let rows = [...records].reverse(); // newest first
  if (actFilter && actFilter !== 'all') rows = rows.filter(r => r.action === actFilter);
  if (emailFilter) rows = rows.filter(r => r.email.includes(emailFilter));

  if (!rows.length) return '<div class="no-data">No records</div>';

  let html = `<table class="log-table"><thead>
    <tr><th>Time (ICT)</th><th>User</th><th>Action</th><th>Survey</th></tr>
  </thead><tbody>`;
  rows.forEach(r => {
    const survey = r.survey_name ? `${r.survey_name}${r.survey_id ? ` <span style="color:#aaa">#${r.survey_id}</span>` : ''}` : '<span class="never">—</span>';
    html += `<tr>
      <td class="ts-cell">${fmtTs(r.ts)}</td>
      <td class="email">${r.email}</td>
      <td><span class="pill ${pillCls(r.action)}">${pillLbl(r.action)}</span></td>
      <td>${survey}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  return html;
}

function filterRecent() {
  const act   = document.getElementById('actFilter')?.value || 'all';
  const email = document.getElementById('emailFilter')?.value || '';
  document.getElementById('recentWrap').innerHTML = buildRecentTable(window._recData || [], act, email);
}

load();
</script>
</body>
</html>
